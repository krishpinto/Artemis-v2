<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370" role="img" aria-labelledby="title desc">
  <title id="title">Artemis v2 system architecture</title>
  <desc id="desc">Top-down flow from developers, coding agents, and CI through Artemis interfaces and core, then through replaceable adapters to local services and application processes.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .band-title { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .box-title { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .small { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1370" fill="#f8fafc"/>

  <text x="80" y="65" class="title">Artemis v2: local backend control plane</text>
  <text x="80" y="98" class="subtitle">The runtime runs containers. Artemis understands the project, its services, and its data.</text>

  <!-- Users -->
  <text x="80" y="150" class="band-title">1. USERS AND AUTOMATION</text>
  <rect x="80" y="172" width="420" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="290" y="210" text-anchor="middle" class="box-title">Developer</text>
  <text x="290" y="237" text-anchor="middle" class="box-copy">Runs commands and uses Mission Control</text>

  <rect x="590" y="172" width="420" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="210" text-anchor="middle" class="box-title">Coding agent</text>
  <text x="800" y="237" text-anchor="middle" class="box-copy">Codex, Claude Code, Cursor, or another MCP client</text>

  <rect x="1100" y="172" width="420" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1310" y="210" text-anchor="middle" class="box-title">CI job</text>
  <text x="1310" y="237" text-anchor="middle" class="box-copy">Creates a clean environment and verifies scenarios</text>

  <!-- User to interface arrows -->
  <path class="arrow" d="M 230 264 L 230 315"/>
  <path class="arrow" d="M 350 264 L 350 292 L 560 292 L 560 315"/>
  <path class="arrow" d="M 800 264 L 800 292 L 930 292 L 930 315"/>
  <path class="arrow" d="M 1310 264 L 1310 292 L 230 292 L 230 315"/>

  <!-- Interfaces -->
  <text x="80" y="307" class="band-title">2. ARTEMIS INTERFACES</text>
  <rect x="80" y="326" width="300" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="363" text-anchor="middle" class="box-title">CLI and TUI</text>
  <text x="230" y="389" text-anchor="middle" class="box-copy">Node.js + TypeScript + Commander + Ink</text>

  <rect x="410" y="326" width="300" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="363" text-anchor="middle" class="box-title">Mission Control</text>
  <text x="560" y="389" text-anchor="middle" class="box-copy">Vite + React + TypeScript SPA</text>

  <rect x="780" y="326" width="300" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="930" y="363" text-anchor="middle" class="box-title">MCP server</text>
  <text x="930" y="389" text-anchor="middle" class="box-copy">Official MCP TypeScript SDK + stdio</text>

  <rect x="1130" y="326" width="390" height="88" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="1325" y="363" text-anchor="middle" class="box-title">Local control API</text>
  <text x="1325" y="389" text-anchor="middle" class="box-copy">Fastify + JSON REST + Server-Sent Events</text>

  <path class="arrow" d="M 230 414 L 230 446 L 1210 446 L 1210 414"/>
  <path class="arrow" d="M 560 414 L 560 446 L 1255 446 L 1255 414"/>
  <path class="arrow" d="M 930 414 L 930 446 L 1300 446 L 1300 414"/>

  <!-- Core -->
  <path class="arrow" d="M 1325 414 L 1325 485 L 800 485 L 800 520"/>
  <text x="80" y="511" class="band-title">3. PROVIDER-INDEPENDENT ARTEMIS CORE</text>
  <rect x="80" y="532" width="1440" height="242" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2.5"/>
  <text x="800" y="557" text-anchor="middle" class="small">Strict TypeScript domain and application code; no UI, Docker, Kubernetes, or database dependencies</text>

  <rect x="108" y="572" width="250" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="233" y="611" text-anchor="middle" class="box-title">Project loader</text>
  <text x="233" y="640" text-anchor="middle" class="box-copy">Reads artemis.yml</text>
  <text x="233" y="664" text-anchor="middle" class="box-copy">Validates recipes</text>
  <text x="233" y="688" text-anchor="middle" class="box-copy">Resolves project identity</text>

  <rect x="388" y="572" width="250" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="513" y="611" text-anchor="middle" class="box-title">Planner and reconciler</text>
  <text x="513" y="640" text-anchor="middle" class="box-copy">Compares desired and actual state</text>
  <text x="513" y="664" text-anchor="middle" class="box-copy">Creates an execution plan</text>
  <text x="513" y="688" text-anchor="middle" class="box-copy">Preserves project data</text>

  <rect x="668" y="572" width="250" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="793" y="611" text-anchor="middle" class="box-title">Tasks and scenarios</text>
  <text x="793" y="640" text-anchor="middle" class="box-copy">Migrations and seeds</text>
  <text x="793" y="664" text-anchor="middle" class="box-copy">Reset and named scenarios</text>
  <text x="793" y="688" text-anchor="middle" class="box-copy">Snapshots and restores</text>

  <rect x="948" y="572" width="250" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="1073" y="611" text-anchor="middle" class="box-title">Health and diagnostics</text>
  <text x="1073" y="640" text-anchor="middle" class="box-copy">Readiness and authentication</text>
  <text x="1073" y="664" text-anchor="middle" class="box-copy">Ports and connectivity</text>
  <text x="1073" y="688" text-anchor="middle" class="box-copy">Actionable failure explanations</text>

  <rect x="1228" y="572" width="264" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="1360" y="611" text-anchor="middle" class="box-title">Policy and events</text>
  <text x="1360" y="640" text-anchor="middle" class="box-copy">Permissions and confirmations</text>
  <text x="1360" y="664" text-anchor="middle" class="box-copy">Shared lifecycle event stream</text>
  <text x="1360" y="688" text-anchor="middle" class="box-copy">Agent audit log</text>

  <path class="arrow" d="M 233 727 L 233 748 L 800 748 L 800 820"/>
  <path class="arrow" d="M 513 727 L 513 770 L 430 770 L 430 820"/>
  <path class="arrow" d="M 793 727 L 793 770 L 800 770 L 800 820"/>
  <path class="arrow" d="M 1073 727 L 1073 770 L 800 770 L 800 820"/>
  <path class="arrow" d="M 1360 727 L 1360 770 L 1170 770 L 1170 820"/>

  <!-- Contracts -->
  <text x="80" y="811" class="band-title">4. STABLE CORE CONTRACTS</text>
  <rect x="110" y="832" width="420" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="872" text-anchor="middle" class="box-title">Runtime provider</text>
  <text x="320" y="899" text-anchor="middle" class="box-copy">TypeScript interface implemented by runtime plugins</text>

  <rect x="590" y="832" width="420" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="872" text-anchor="middle" class="box-title">Service data adapter</text>
  <text x="800" y="899" text-anchor="middle" class="box-copy">TypeScript interface implemented by service clients</text>

  <rect x="1070" y="832" width="420" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1280" y="872" text-anchor="middle" class="box-title">State and process ports</text>
  <text x="1280" y="899" text-anchor="middle" class="box-copy">Filesystem state and trusted Node.js child processes</text>

  <path class="arrow" d="M 320 932 L 320 992"/>
  <path class="arrow" d="M 800 932 L 800 992"/>
  <path class="arrow" d="M 1280 932 L 1280 992"/>

  <!-- Adapters -->
  <text x="80" y="983" class="band-title">5. REPLACEABLE ADAPTERS</text>
  <rect x="80" y="1004" width="440" height="142" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="1042" text-anchor="middle" class="box-title">Runtime adapters</text>
  <rect x="108" y="1063" width="240" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="228" y="1098" text-anchor="middle" class="small">execa + Compose CLI</text>
  <rect x="365" y="1063" width="128" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="429" y="1088" text-anchor="middle" class="small">client-node</text>
  <text x="429" y="1107" text-anchor="middle" class="box-copy">optional</text>

  <rect x="550" y="1004" width="590" height="142" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="845" y="1042" text-anchor="middle" class="box-title">Service adapters</text>
  <rect x="578" y="1063" width="100" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="628" y="1097" text-anchor="middle" class="small">Postgres</text>
  <rect x="690" y="1063" width="100" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="1097" text-anchor="middle" class="small">Redis</text>
  <rect x="802" y="1063" width="100" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="852" y="1097" text-anchor="middle" class="small">MinIO</text>
  <rect x="914" y="1063" width="100" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="964" y="1097" text-anchor="middle" class="small">Mailpit</text>
  <rect x="1026" y="1063" width="88" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1070" y="1097" text-anchor="middle" class="small">Generic</text>

  <rect x="1170" y="1004" width="350" height="142" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1345" y="1042" text-anchor="middle" class="box-title">Local implementations</text>
  <text x="1345" y="1076" text-anchor="middle" class="box-copy">Atomic JSON state + NDJSON audit log</text>
  <text x="1345" y="1100" text-anchor="middle" class="box-copy">OS-protected secret file</text>
  <text x="1345" y="1124" text-anchor="middle" class="box-copy">Node.js process runner</text>

  <path class="arrow" d="M 228 1146 L 228 1214"/>
  <path class="arrow-dashed" d="M 429 1146 L 429 1190 L 500 1190 L 500 1214"/>
  <path class="arrow" d="M 845 1146 L 845 1190 L 800 1190 L 800 1214"/>
  <path class="arrow" d="M 1345 1146 L 1345 1190 L 1300 1190 L 1300 1214"/>

  <!-- Execution -->
  <text x="80" y="1205" class="band-title">6. EXECUTION AND PROJECT DATA</text>
  <rect x="80" y="1226" width="440" height="100" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="300" y="1266" text-anchor="middle" class="box-title">Container engine or cluster</text>
  <text x="300" y="1293" text-anchor="middle" class="box-copy">Runs replaceable execution artifacts</text>

  <rect x="580" y="1226" width="440" height="100" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="800" y="1266" text-anchor="middle" class="box-title">Project services and data</text>
  <text x="800" y="1293" text-anchor="middle" class="box-copy">Databases, cache, buckets, mail, and volumes</text>

  <rect x="1080" y="1226" width="440" height="100" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="1300" y="1266" text-anchor="middle" class="box-title">Developer application</text>
  <text x="1300" y="1293" text-anchor="middle" class="box-copy">Receives generated endpoints and credentials</text>

  <path class="arrow" d="M 520 1276 L 580 1276"/>
  <path class="arrow" d="M 1020 1276 L 1080 1276"/>

  <line x1="80" y1="1344" x2="1520" y2="1344" class="divider"/>
  <text x="80" y="1364" class="small">Main flow: declare project - plan desired state - run services - verify readiness - migrate and seed - expose one truthful control surface</text>
</svg>
